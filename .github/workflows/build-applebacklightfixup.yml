name: Build AppleBacklightFixup and Lilu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Lilu
        uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          path: Lilu
          fetch-depth: 0

      - name: Prepare Lilu bootstrap and ensure MacKernelSDK headers
        working-directory: Lilu
        run: |
          set -euo pipefail
          chmod +x Scripts/bootstrap.sh || true
          ./Scripts/bootstrap.sh || true

          if [ ! -d "MacKernelSDK/Headers" ] || [ -z "$(ls -A MacKernelSDK/Headers 2>/dev/null || true)" ]; then
            echo "MacKernelSDK/Headers missing — cloning fallback MacKernelSDK repo"
            rm -rf MacKernelSDK || true
            git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK || true
          else
            echo "MacKernelSDK/Headers present from bootstrap"
          fi

          echo "=== MacKernelSDK top-level ==="
          ls -la MacKernelSDK || true

          echo "=== Kernel.framework headers (expected path) ==="
          if [ -d "MacKernelSDK/Headers/System/Library/Frameworks/Kernel.framework/Headers" ]; then
            ls -la MacKernelSDK/Headers/System/Library/Frameworks/Kernel.framework/Headers | sed -n '1,200p'
          else
            echo "Kernel.framework headers not found at MacKernelSDK/Headers/System/Library/Frameworks/Kernel.framework/Headers"
            echo "Listing MacKernelSDK/Headers tree (first 4 levels):"
            find MacKernelSDK/Headers -maxdepth 4 -type d -print -exec ls -la {} \; || true
          fi

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version || true
          xcrun --sdk macosx --show-sdk-path || true

      - name: Build Lilu (use project defaults; do not inject Kernel.framework headers)
        working-directory: Lilu
        run: |
          set -euo pipefail
          mkdir -p build/logs
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          echo "Using SDK: $SDK_PATH"
          echo "Confirm MacKernelSDK root:"
          ls -la MacKernelSDK/Headers || true

          # Use project defaults so Lilu's Xcode project controls header ordering.
          xcodebuild -project Lilu.xcodeproj -scheme Lilu -configuration Release \
            -sdk macosx \
            SDKROOT="$SDK_PATH" \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            | tee build/logs/lilu-xcode.log
          tail -n 200 build/logs/lilu-xcode.log || true

      - name: Upload Lilu logs
        uses: actions/upload-artifact@v4
        with:
          name: lilu-logs
          path: Lilu/build/logs/lilu-xcode.log

      - name: Copy built Lilu.kext into workspace (if present)
        run: |
          mkdir -p workspace_kexts
          if [ -d "Lilu/build/Release/Lilu.kext" ]; then
            cp -R Lilu/build/Release/Lilu.kext workspace_kexts/Lilu.kext
          elif [ -d "Lilu/build/Build/Products/Release/Lilu.kext" ]; then
            cp -R Lilu/build/Build/Products/Release/Lilu.kext workspace_kexts/Lilu.kext
          else
            FOUND=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Lilu-*" -exec find {} -path "*/Build/Products/Release/Lilu.kext" -print \; | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              cp -R "$FOUND" workspace_kexts/Lilu.kext
            else
              echo "Lilu.kext not found after build" && ls -R Lilu || true
            fi
          fi
          ls -la workspace_kexts || true

      - name: Checkout AppleBacklightFixup source
        uses: actions/checkout@v4
        with:
          repository: RehabMan/AppleBacklightFixup
          path: AppleBacklightFixup
          fetch-depth: 0

      - name: Copy Lilu.kext into AppleBacklightFixup folder (if available)
        run: |
          cp -R workspace_kexts/Lilu.kext AppleBacklightFixup/Lilu.kext || true
          ls -la AppleBacklightFixup || true

      - name: Build AppleBacklightFixup Build AppleBacklightFixup (use project defaults; do not inject Kernel.framework headers)
        working-directory: AppleBacklightFixup
        run: |
          set -euo pipefail
          mkdir -p build/logs
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          echo "Using SDK: $SDK_PATH"
          echo "Confirm Lilu MacKernelSDK path:"
          ls -la ../Lilu/MacKernelSDK/Headers || true

          # Use project defaults so AppleBacklightFixup's Xcode project controls header ordering.
          xcodebuild -project AppleBacklightFixup.xcodeproj -scheme AppleBacklightFixup -configuration Release \
            -sdk macosx \
            SDKROOT="$SDK_PATH" \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            | tee build/logs/applebacklightfixup-xcode.log
          tail -n 200 build/logs/applebacklightfixup-xcode.log || true

      - name: Upload AppleBacklightFixup logs
        uses: actions/upload-artifact@v4
        with:
          name: applebacklightfixup-logs
          path: AppleBacklightFixup/build/logs/applebacklightfixup-xcode.log

      - name: Collect built AppleBacklightFixup.kext
        working-directory: AppleBacklightFixup
        run: |
          mkdir -p build_output
          KEXT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "*AppleBacklightFixup*" -exec find {} -path "*/Build/Products/Release/AppleBacklightFixup.kext" -print \; | head -n 1 || true)
          if [ -z "$KEXT_PATH" ] && [ -d "build/Release/AppleBacklightFixup.kext" ]; then
            KEXT_PATH="$(pwd)/build/Release/AppleBacklightFixup.kext"
          fi
          if [ -n "$KEXT_PATH" ] && [ -d "$KEXT_PATH" ]; then
            cp -R "$KEXT_PATH" build_output/AppleBacklightFixup.kext
          else
            echo "AppleBacklightFixup.kext not found at $KEXT_PATH" && ls -R . || true
            exit 1
          fi
          ls -la build_output

      - name: Upload built kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleBacklightFixup-kext
          path: AppleBacklightFixup/build_output/AppleBacklightFixup.kext
